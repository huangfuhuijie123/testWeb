<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>给最特别的你 ❤</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #ffe6f2;
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            height: 100%;
            background: linear-gradient(45deg, #ff99cc, #ff6699);
        }

        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
        }

        h1 {
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        .message {
            font-size: 1.5em;
            margin: 20px 0;
            line-height: 1.6;
            opacity: 0;
            animation: fadeIn 2s forwards;
            animation-delay: 1s;
        }

        .photo-frame {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border-radius: 50%;
            border: 5px solid white;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        .photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            color: #ff3366;
            animation: fall 3s linear infinite;
        }

        @keyframes fall {
            0% {
                opacity: 0;
                transform: translateY(-10vh) rotate(0deg);
            }
            100% {
                opacity: 1;
                transform: translateY(110vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hearts" id="hearts"></div>
        
        <div class="content">
            <h1>亲爱的宝宝</h1>
            <div class="message">
		<p>对不起，我知道错了</p >
                <p>从遇见你的那天起</p >
                <p>我的世界开始有了不同的色彩</p >
		<p>我知道你已经对我感到无比的失望了</p>
		<p>我从来没有想过把你的青春浪费掉</p>
		<p>相反我希望我自己可以对你负责</p>
		<p>正是因为这份责任心，我才一直在不断地寻找更加合适的工作</p>
		<p>那个保安工作，我没有去是因为我知道他是骗人的</p>
		<p>对不起，我没有告诉你这些，是因为你非常想让我去，我不想你感到落差</p>
                <p>你愿意让这个故事继续书写吗？</p >
		<p>不论你愿不愿意我都可以接受，但是你一定要把你自己的真实想法告诉我，我不想你受到委屈</p>
                <p>❤️ ❤️ ❤️</p >
            </div>
	     <h1>我爱你</h1>
        </div>
    </div>

    <!-- 背景音乐 -->
    <audio autoplay loop>
        <!-- 替换为你的音乐文件路径 -->
        <source src="\周杰伦 - 说好不哭 (with 五月天阿信).mp3" type="audio/mpeg">
    </audio>

    <script>
        // 创建飘落爱心
        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            for (let i = 0; i < 30; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤';
                heart.classList.add('heart');
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heartsContainer.appendChild(heart);
            }
        }

        // 初始化
        window.onload = function() {
            createHearts();
            
            // 点击任意位置播放音乐
            document.body.addEventListener('click', function() {
                document.querySelector('audio').play();
            });
        }
    </script>
</body>
</html>
